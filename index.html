￼<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d3b28c" />
  <title>BOU&MUS</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.15), transparent 32%),
        linear-gradient(180deg, #dcc3a4 0%, #d2af86 100%);
      color: #fffaf4;
      display: flex;
      justify-content: center;
    }

    .page {
      width: min(100%, 520px);
      min-height: 100vh;
      padding: 26px 22px 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: min(88vw, 360px);
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 22px rgba(97, 68, 40, 0.08));
    }

    .subtitle {
      margin-top: 10px;
      color: rgba(255,250,244,.92);
      letter-spacing: 6px;
      font-size: 11px;
      text-transform: uppercase;
    }

    .links {
      width: 100%;
      display: grid;
      gap: 14px;
    }

    .btn {
      width: 100%;
      min-height: 72px;
      border-radius: 20px;
      padding: 0 24px;
      text-decoration: none;
      color: #fffaf4;
      display: grid;
      grid-template-columns: 30px 1fr 30px;
      align-items: center;
      background: rgba(169, 136, 102, 0.16);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        0 10px 30px rgba(97, 68, 40, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      background: rgba(169, 136, 102, 0.23);
      border-color: rgba(255,255,255,0.24);
    }

    .btn:active { transform: scale(.985); }

    .btn-label {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .2px;
    }

    .icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
      display: block;
      opacity: .98;
    }



    .catalog-icon {
      width: 30px;
      height: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      color: #fffaf4;
    }

    .catalog-icon .bm {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      letter-spacing: -3px;
      margin-right: 3px;
    }

    .catalog-icon .boumus {
      margin-top: 3px;
      font-size: 4px;
      letter-spacing: .7px;
      white-space: nowrap;
    }

    footer {
      margin-top: auto;
      padding-top: 42px;
      font-size: 11px;
      letter-spacing: 1.8px;
      opacity: .72;
      color: rgba(255,250,244,.88);
    }

    @media (max-width: 420px) {
      .page { padding-left: 18px; padding-right: 18px; }
      .brand-logo { width: min(90vw, 330px); }
      .btn { min-height: 68px; border-radius: 18px; }
      .btn-label { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="brand" aria-label="Marca BOU&MUS">
